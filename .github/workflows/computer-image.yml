name: Build computer image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      # The service now reads the shared contract, so a change there must rebuild
      # the image. Omitting it would let the app and the image drift apart
      # silently, which is the exact failure the contract exists to surface.
      - shared/**
      - services/computer/**
      - .github/workflows/computer-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: khloei-computer-image
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/khloei-computer

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --cwd services/computer --frozen-lockfile

      - name: Typecheck
        run: bun run --cwd services/computer typecheck

      - name: Test
        run: bun run --cwd services/computer test

      # The desktop image is roughly 7.5 GB. A hosted runner starts with about
      # 14 GB free, so the image plus its build cache can exhaust the disk. That
      # surfaces only as a container that will not start, with no error of its
      # own, so the space is reclaimed before the build rather than diagnosed
      # after it.
      - name: Free disk space for the desktop image
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force
          df -h /

      - name: Build smoke image
        run: |
          docker build --platform linux/amd64 --file services/computer/Dockerfile.desktop --tag khloei-computer:smoke .
          docker builder prune --force >/dev/null 2>&1 || true
          df -h /

      - name: Boot and verify smoke image
        run: |
          # Trace every command: the previous two failures exited non-zero with no
          # output at all, which said nothing about which command failed.
          set -x
          # Report rather than assume: a container that dies on start otherwise
          # leaves nothing but a non-zero exit.
          if ! docker run --detach --name khloei-computer-smoke --platform linux/amd64 --shm-size 2g --publish 4100:4100 --env COMPUTER_TOKEN=ci-computer-token khloei-computer:smoke; then
            docker logs khloei-computer-smoke 2>&1 | tail -50 || true
            docker inspect khloei-computer-smoke --format 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' || true
            df -h /
            exit 1
          fi
          for attempt in {1..120}; do
            if curl --fail --silent http://127.0.0.1:4100/health | jq --exit-status '.status == "ok" and .surface == "desktop" and .desktop.ready == true and .capabilities.shell == true and (.contract.version | type == "number") and (.computerSessionId | startswith("computer_"))' >/dev/null; then
              break
            fi
            if ! docker inspect khloei-computer-smoke --format '{{.State.Running}}' | grep -q true; then
              echo "The smoke container stopped before it became healthy."
              docker logs khloei-computer-smoke 2>&1 | tail -50 || true
              docker inspect khloei-computer-smoke --format 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' || true
              df -h /
              exit 1
            fi
            if [ "$attempt" -eq 120 ]; then
              docker logs khloei-computer-smoke 2>&1 | tail -50
              docker inspect khloei-computer-smoke --format 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' || true
              df -h /
              exit 1
            fi
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4100/control)" = "401"
          curl --fail --silent \
            --header 'Authorization: Bearer ci-computer-token' \
            --header 'Content-Type: application/json' \
            --data '{"command":"printf shell-ok:; id -u; test -z \"$COMPUTER_TOKEN\""}' \
            http://127.0.0.1:4100/exec \
            | jq --exit-status '.exitCode == 0 and .stdout == "shell-ok:1000\n" and .timedOut == false' >/dev/null
          # The image's own HEALTHCHECK has a 45s start period and a 5s interval,
          # so it reports "starting" for a while after the API is already
          # answering. Wait for its verdict instead of demanding it immediately.
          for attempt in {1..120}; do
            health="$(docker inspect --format '{{.State.Health.Status}}' khloei-computer-smoke)"
            if [ "$health" = "healthy" ]; then
              break
            fi
            if [ "$health" = "unhealthy" ] || [ "$attempt" -eq 120 ]; then
              echo "The smoke container healthcheck reported $health."
              docker logs khloei-computer-smoke 2>&1 | tail -50 || true
              exit 1
            fi
            sleep 1
          done
          # The image must implement the contract this commit's app expects, so a
          # parity break is caught here rather than as degraded behaviour in production.
          # Anchored to the exported constant: an unanchored match also matches
          # MINIMUM_COMPUTER_CONTRACT_VERSION, which made this two numbers and
          # fed jq invalid JSON.
          expected="$(grep -oE '^export const COMPUTER_CONTRACT_VERSION = [0-9]+' shared/computer-contract.ts | grep -oE '[0-9]+')"
          curl --fail --silent http://127.0.0.1:4100/health \
            | jq --exit-status --argjson expected "$expected" '.contract.version == $expected' >/dev/null

      - name: Stop smoke image
        if: always()
        run: docker rm --force khloei-computer-smoke >/dev/null 2>&1 || true

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish computer image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/computer/Dockerfile.desktop
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Railway CLI
        if: vars.RAILWAY_DEPLOY_ENABLED == 'true'
        run: npm install --global @railway/cli@5.43.1

      - name: Deploy the published image to Railway
        if: vars.RAILWAY_DEPLOY_ENABLED == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: >-
          railway redeploy
          --project 791f0f7b-cdb6-41db-b54e-7b3743300d74
          --environment production
          --service khloei-computer
          --from-source
          --yes
