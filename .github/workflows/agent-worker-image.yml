name: Build agent worker image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - shared/**
      - services/agent-worker/**
      - .github/workflows/agent-worker-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: khloei-agent-worker-image
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/khloei-agent-worker

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 24.15.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install shared application dependencies
        run: npm ci --ignore-scripts

      - name: Install dependencies
        run: bun install --cwd services/agent-worker --frozen-lockfile

      - name: Typecheck
        run: bun run --cwd services/agent-worker typecheck

      - name: Test
        run: bun run --cwd services/agent-worker test

      - name: Build smoke image
        run: docker build --file services/agent-worker/Dockerfile --tag khloei-agent-worker:smoke .

      - name: Boot and verify smoke image
        run: |
          docker run --detach --name khloei-agent-worker-smoke --publish 4200:4200 --env KHLOEI_AGENT_WORKER_TOKEN=ci-worker-token --env KHLOEI_APP_URL=http://127.0.0.1:3000 khloei-agent-worker:smoke
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4200/health | jq --exit-status '.durable == true and .status == "ok"' >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs khloei-agent-worker-smoke
              exit 1
            fi
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST http://127.0.0.1:4200/v1/tasks)" = "401"

      - name: Stop smoke image
        if: always()
        run: docker rm --force khloei-agent-worker-smoke >/dev/null 2>&1 || true

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish agent worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/agent-worker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Railway CLI
        if: vars.RAILWAY_AGENT_WORKER_DEPLOY_ENABLED == 'true'
        run: npm install --global @railway/cli@5.43.1

      - name: Deploy the published image to Railway
        if: vars.RAILWAY_AGENT_WORKER_DEPLOY_ENABLED == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway redeploy \
            --project 791f0f7b-cdb6-41db-b54e-7b3743300d74 \
            --environment production \
            --service khloei-agent-worker \
            --from-source \
            --yes

          # `railway redeploy` returns as soon as the deployment is queued, so a
          # deployment that later fails was still reported here as a success.
          # That is exactly how a broken image reached production unnoticed:
          # green workflow, failed rollout. Wait for Railway's own verdict.
          for attempt in $(seq 1 90); do
            status="$(railway deployment list --service khloei-agent-worker 2>/dev/null \
              | sed -n '2p' | awk -F'|' '{gsub(/^[ \t]+|[ \t]+$/,"",$2); print $2}')"
            echo "Railway deployment status: ${status:-unknown}"
            case "$status" in
              SUCCESS) exit 0 ;;
              FAILED|CRASHED|REMOVED)
                echo "The Railway deployment reported $status."
                railway logs --service khloei-agent-worker 2>&1 | tail -50 || true
                exit 1
                ;;
            esac
            sleep 20
          done
          echo "The Railway deployment did not settle within 30 minutes."
          exit 1
